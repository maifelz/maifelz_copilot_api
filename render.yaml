services:
  - type: web
    name: maifelz-odoo-copilot-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: starter
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MAIFELZ_ADMIN_PASSWORD
        value: MaifelzAdmin2026!
      - key: GEMINI_API_KEY
        sync: false
